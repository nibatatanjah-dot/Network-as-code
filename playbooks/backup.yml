---
- name: Back up current device configurations (read-only with respect to device config)
  hosts: network_devices
  gather_facts: false
  serial: 1
  tasks:
    - name: Create controller-side backup directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../evidence/backups/{{ inventory_hostname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Save a controller-side backup of the running configuration
      cisco.ios.ios_config:
        backup: true
        backup_options:
          dir_path: "{{ playbook_dir }}/../evidence/backups/{{ inventory_hostname }}"
      register: backup_result

    - name: Display only the backup file location
      ansible.builtin.debug:
        msg: "Backup created for {{ inventory_hostname }}: {{ backup_result.backup_path | default('see Ansible task result') }}"
