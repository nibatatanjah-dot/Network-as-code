sites:
  - key: hq
    site_id: 10
    router: HQ-R1
    switch: HQ-SW1
    router_id: 10.255.0.1
    server_attached: true
    wan:
      interface: GigabitEthernet0/0
      address: 203.0.113.2
      mask: 255.255.255.252
      next_hop: 203.0.113.1
      peer_network: 203.0.113.0/30
    lan_trunk_interface: GigabitEthernet0/1
    switch_uplink_interface: GigabitEthernet0/1
    switch_management_ip: 10.10.99.2
    test_hosts:
      staff: 10.10.10.100
      guest: 10.10.30.100
    tunnels:
      - interface: Tunnel1
        local_address: 172.16.0.1
        local_mask: 255.255.255.252
        network: 172.16.0.0/30
        remote_address: 172.16.0.2
        remote_wan_address: 198.51.100.2
        remote_router: BR1-R1
        crypto_sequence: 10
        crypto_acl: VPN-GRE-HQ-BR1
        key_environment_variable: P3_IPSEC_PSK_HQ_BR1
      - interface: Tunnel2
        local_address: 172.16.0.5
        local_mask: 255.255.255.252
        network: 172.16.0.4/30
        remote_address: 172.16.0.6
        remote_wan_address: 192.0.2.2
        remote_router: BR2-R1
        crypto_sequence: 20
        crypto_acl: VPN-GRE-HQ-BR2
        key_environment_variable: P3_IPSEC_PSK_HQ_BR2
  - key: branch1
    site_id: 20
    router: BR1-R1
    switch: BR1-SW1
    router_id: 10.255.0.2
    server_attached: false
    wan:
      interface: GigabitEthernet0/0
      address: 198.51.100.2
      mask: 255.255.255.252
      next_hop: 198.51.100.1
      peer_network: 198.51.100.0/30
    lan_trunk_interface: GigabitEthernet0/1
    switch_uplink_interface: GigabitEthernet0/1
    switch_management_ip: 10.20.99.2
    test_hosts:
      staff: 10.20.10.100
      guest: 10.20.30.100
    tunnels:
      - interface: Tunnel1
        local_address: 172.16.0.2
        local_mask: 255.255.255.252
        network: 172.16.0.0/30
        remote_address: 172.16.0.1
        remote_wan_address: 203.0.113.2
        remote_router: HQ-R1
        crypto_sequence: 10
        crypto_acl: VPN-GRE-BR1-HQ
        key_environment_variable: P3_IPSEC_PSK_HQ_BR1
  - key: branch2
    site_id: 30
    router: BR2-R1
    switch: BR2-SW1
    router_id: 10.255.0.3
    server_attached: false
    wan:
      interface: GigabitEthernet0/0
      address: 192.0.2.2
      mask: 255.255.255.252
      next_hop: 192.0.2.1
      peer_network: 192.0.2.0/30
    lan_trunk_interface: GigabitEthernet0/1
    switch_uplink_interface: GigabitEthernet0/1
    switch_management_ip: 10.30.99.2
    test_hosts:
      staff: 10.30.10.100
      guest: 10.30.30.100
    tunnels:
      - interface: Tunnel1
        local_address: 172.16.0.6
        local_mask: 255.255.255.252
        network: 172.16.0.4/30
        remote_address: 172.16.0.5
        remote_wan_address: 203.0.113.2
        remote_router: HQ-R1
        crypto_sequence: 10
        crypto_acl: VPN-GRE-BR2-HQ
        key_environment_variable: P3_IPSEC_PSK_HQ_BR2
isp:
  hostname: ISP
  interfaces:
    - name: GigabitEthernet0/0
      address: 203.0.113.1
      mask: 255.255.255.252
      description: to-HQ-R1
    - name: GigabitEthernet0/1
      address: 198.51.100.1
      mask: 255.255.255.252
      description: to-BR1-R1
    - name: GigabitEthernet0/2
      address: 192.0.2.1
      mask: 255.255.255.252
      description: to-BR2-R1
  loopback:
    interface: Loopback0
    address: 8.8.8.8
    mask: 255.255.255.255
