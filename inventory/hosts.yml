---
# Documentation-only inventory. The addresses below are TEST-NET placeholders,
# not real reachable device addresses. Deployment guards are false by default.
all:
  children:
    network_devices:
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.ios
        ansible_user: "{{ lookup('env', 'P3_DEVICE_USERNAME') }}"
        ansible_password: "{{ lookup('env', 'P3_DEVICE_PASSWORD') }}"
        ansible_become: true
        ansible_become_method: enable
        ansible_become_password: "{{ lookup('env', 'P3_ENABLE_PASSWORD') }}"
        deployment_verified: false
        p3_rollback_method_verified: false
      hosts:
        HQ-R1:
          # Replace this TEST-NET IP; set both verification flags true only after real tests.
          deployment_verified: false
          p3_rollback_method_verified: false
          ansible_host: 192.0.2.10
          p3_candidate_config: "{{ lookup('env', 'P3_CANDIDATE_DIR') }}/HQ-R1.cfg"
        BR1-R1:
          # Replace this TEST-NET IP; set both verification flags true only after real tests.
          deployment_verified: false
          p3_rollback_method_verified: false
          ansible_host: 192.0.2.20
          p3_candidate_config: "{{ lookup('env', 'P3_CANDIDATE_DIR') }}/BR1-R1.cfg"
        BR2-R1:
          # Replace this TEST-NET IP; set both verification flags true only after real tests.
          deployment_verified: false
          p3_rollback_method_verified: false
          ansible_host: 192.0.2.30
          p3_candidate_config: "{{ lookup('env', 'P3_CANDIDATE_DIR') }}/BR2-R1.cfg"
        HQ-SW1:
          # Replace this TEST-NET IP; set both verification flags true only after real tests.
          deployment_verified: false
          p3_rollback_method_verified: false
          ansible_host: 192.0.2.11
          p3_candidate_config: "{{ lookup('env', 'P3_CANDIDATE_DIR') }}/HQ-SW1.cfg"
        BR1-SW1:
          # Replace this TEST-NET IP; set both verification flags true only after real tests.
          deployment_verified: false
          p3_rollback_method_verified: false
          ansible_host: 192.0.2.21
          p3_candidate_config: "{{ lookup('env', 'P3_CANDIDATE_DIR') }}/BR1-SW1.cfg"
        BR2-SW1:
          # Replace this TEST-NET IP; set both verification flags true only after real tests.
          deployment_verified: false
          p3_rollback_method_verified: false
          ansible_host: 192.0.2.31
          p3_candidate_config: "{{ lookup('env', 'P3_CANDIDATE_DIR') }}/BR2-SW1.cfg"
